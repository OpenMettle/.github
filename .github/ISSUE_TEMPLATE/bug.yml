name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use private vulnerability reporting for security issues. Remove secrets and personal content from logs."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Repository commit or release, OS, relevant hardware, model and runtime versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs and other evidence
      render: text
